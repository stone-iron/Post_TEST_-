<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 등록</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f5f5f5; width: 15%; }
        input[type=text], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 250px; resize: vertical; }
        .buttons { margin-top: 20px; text-align: right; }
        button { padding: 8px 18px; border: none; border-radius: 4px; cursor: pointer; color: #fff; }
        .save { background: #2f6fed; }
        .list { background: #777; }
    </style>
</head>
<body>
    <h2>게시글 등록</h2>

    <form th:action="@{/Post/insert}" method="post">
        <table>
            <tr>
                <th>제목</th>
                <td><input type="text" name="title" required maxlength="200"></td>
            </tr>
            <tr>
                <th>작성자</th>
                <td><input type="text" name="writer" required maxlength="50"></td>
            </tr>
            <tr>
                <th>내용</th>
                <td><textarea name="content" required></textarea></td>
            </tr>
        </table>

        <div class="buttons">
            <button type="submit" class="save">등록</button>
            <button type="button" class="list" th:data-url="@{/Post/list}" onclick="location.href=this.dataset.url">목록</button>
        </div>
    </form>
</body>
</html>
