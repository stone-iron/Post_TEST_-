<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f5f5f5; }
        td.title { text-align: left; }
        a { color: #2f6fed; text-decoration: none; }
        .top { display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 8px 16px; background: #2f6fed; color: #fff; border-radius: 4px; }
        .pagination { margin-top: 20px; text-align: center; }
        .pagination a { display: inline-block; min-width: 32px; padding: 6px 10px; margin: 0 2px; border: 1px solid #ddd; border-radius: 4px; }
        .pagination a.active { background: #2f6fed; color: #fff; border-color: #2f6fed; }
        .info { text-align: center; color: #777; font-size: 14px; }
    </style>
</head>
<body>
    <div class="top">
        <h2>게시글 목록</h2>
        <a class="btn" th:href="@{/Post/insert}">글쓰기</a>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 10%">번호</th>
                <th>제목</th>
                <th style="width: 15%">작성자</th>
                <th style="width: 20%">작성일</th>
                <th style="width: 10%">조회수</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(posts)}">
                <td colspan="5">등록된 게시글이 없습니다.</td>
            </tr>
            <tr th:each="post : ${posts}">
                <td th:text="${post.id}">1</td>
                <td class="title">
                    <a th:href="@{/Post/read/{id}(id=${post.id})}" th:text="${post.title}">제목</a>
                </td>
                <td th:text="${post.writer}">작성자</td>
                <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                <td th:text="${post.viewCount}">0</td>
            </tr>
        </tbody>
    </table>

    <div class="pagination">
        <a th:if="${page.prev}" th:href="@{/Post/list(page=${page.startPage - 1})}">&laquo; 이전</a>
        <th:block th:each="num : ${#numbers.sequence(page.startPage, page.endPage)}">
            <a th:href="@{/Post/list(page=${num})}" th:text="${num}"
               th:classappend="${num == page.page} ? 'active'">1</a>
        </th:block>
        <a th:if="${page.next}" th:href="@{/Post/list(page=${page.endPage + 1})}">다음 &raquo;</a>
    </div>

    <p class="info" th:text="|전체 ${page.totalCount}건 · ${page.page} / ${page.totalPages} 페이지|">전체 0건</p>

    <p><a th:href="@{/}">메인으로</a></p>
</body>
</html>
