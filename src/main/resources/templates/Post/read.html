<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 조회</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f5f5f5; width: 15%; }
        .content { min-height: 200px; white-space: pre-wrap; vertical-align: top; }
        .buttons { margin-top: 20px; text-align: right; }
        button { padding: 8px 18px; border: none; border-radius: 4px; cursor: pointer; color: #fff; }
        .edit { background: #2f6fed; }
        .list { background: #777; }
    </style>
</head>
<body>
    <h2>게시글 조회</h2>

    <table>
        <tr>
            <th>번호</th>
            <td th:text="${post.id}">1</td>
        </tr>
        <tr>
            <th>제목</th>
            <td th:text="${post.title}">제목</td>
        </tr>
        <tr>
            <th>작성자</th>
            <td th:text="${post.writer}">작성자</td>
        </tr>
        <tr>
            <th>작성일</th>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
        </tr>
        <tr>
            <th>수정일</th>
            <td th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
        </tr>
        <tr>
            <th>조회수</th>
            <td th:text="${post.viewCount}">0</td>
        </tr>
        <tr>
            <th>내용</th>
            <td class="content" th:text="${post.content}">내용</td>
        </tr>
    </table>

    <div class="buttons">
        <button type="button" class="edit"
                th:data-url="@{/Post/update/{id}(id=${post.id})}" onclick="location.href=this.dataset.url">수정</button>
        <button type="button" class="list"
                th:data-url="@{/Post/list}" onclick="location.href=this.dataset.url">목록</button>
    </div>
</body>
</html>
